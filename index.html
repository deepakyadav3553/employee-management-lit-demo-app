<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HR Portal — Employee Management</title>
    <!-- Global CSS variables: the single place to control the app's theme. -->
    <link rel="stylesheet" href="./src/styles/variables.css" />
    <!--
      Font Awesome (free). Loaded globally so its @font-face is registered at
      the document level — @font-face reaches into shadow DOM, so <app-icon>
      can render glyphs with the Font Awesome font inside its own shadow root.
    -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-bg);
        color: var(--color-text);
      }
    </style>
    <script type="module" src="./dist/main.js"></script>
  </head>
  <body>
    <app-shell></app-shell>
  </body>
</html>
